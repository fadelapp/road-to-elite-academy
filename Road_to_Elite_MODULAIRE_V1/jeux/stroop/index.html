<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stroop Football — 15 niveaux</title>
<style>
:root{
  --bg:#07100b;--panel:#101a14;--text:#f7fff9;--muted:#9bad9f;
  --accent:#b8f20d;--good:#38dc79;--bad:#ff5d73;--blue:#55a8ff;--yellow:#f3d93b;--purple:#9b7cff;--orange:#ff9f43;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
button,select{font:inherit}
#app{
  position:fixed;inset:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;
  gap:8px;padding:max(8px,env(safe-area-inset-top)) 9px max(8px,env(safe-area-inset-bottom));
  overflow:hidden;background:radial-gradient(circle at 50% 35%,rgba(47,113,65,.23),transparent 48%),var(--bg)
}
header{display:grid;grid-template-columns:1fr 116px;gap:10px;align-items:center}
h1{margin:0;font-size:clamp(22px,5.7vw,36px);line-height:1}
.subtitle{color:var(--muted);font-size:12px;margin-top:4px}
.control-stack{display:grid;gap:6px}
.select-box{padding:7px 9px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(10,19,13,.84)}
.select-box small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}
select{width:100%;margin-top:3px;padding:6px;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:#08110b;color:#fff}
.skill{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:8px 10px;border:1px solid rgba(184,242,13,.28);border-radius:12px;background:rgba(184,242,13,.06)
}
.skill small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.skill strong{display:block;color:var(--accent);margin-top:2px;font-size:13px}
.progress{display:flex;gap:6px}.step{width:10px;height:10px;border-radius:50%;background:#ffffff33}.step.active{background:var(--accent)}.step.done{background:var(--good)}
.arena{
  min-height:0;position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  gap:10px;padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(16,26,20,.94);overflow:hidden
}
.rule{
  padding:8px 10px;border-radius:12px;background:#0b150e;border:1px solid rgba(255,255,255,.1);
  color:var(--muted);font-size:12px;text-align:center
}
.rule strong{color:var(--text)}
.stimulus-wrap{display:grid;place-items:center;min-height:0}
.stimulus{
  font-weight:950;font-size:clamp(44px,14vw,118px);letter-spacing:.02em;text-align:center;
  padding:12px;line-height:1;word-break:break-word
}
.countdown{position:absolute;top:10px;right:10px;padding:6px 9px;border-radius:999px;background:#07100bcc;color:var(--accent);font-weight:800;font-size:12px}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.answer{
  min-height:58px;border:0;border-radius:13px;color:#07100b;font-weight:900;cursor:pointer;
  padding:8px;font-size:clamp(12px,2.8vw,16px)
}
.answer:active{transform:scale(.98)}
footer{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.status{padding:9px 11px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:#0c160f;color:var(--muted);font-size:12px}
.status strong{color:var(--text)}
.controls{display:flex;gap:7px}
.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--accent);color:#081006;font-weight:900;cursor:pointer}
.btn.secondary{background:#17221b;color:#fff;border:1px solid rgba(255,255,255,.14)}
.overlay{
  position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:18px;
  background:rgba(3,8,5,.82);backdrop-filter:blur(8px)
}
.overlay[hidden]{display:none}
.panel{width:min(92vw,520px);padding:20px;border:1px solid rgba(255,255,255,.14);border-radius:20px;background:#0b150e}
.panel h2{margin:0 0 8px}.panel p{margin:0 0 14px;color:var(--muted);line-height:1.45}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.result-card{padding:10px;border:1px solid rgba(255,255,255,.12);border-radius:12px;text-align:center;background:#101a14}
.result-card small{display:block;color:var(--muted);font-size:10px}.result-card strong{display:block;margin-top:4px;color:var(--accent)}
@media(max-width:620px){
  header{grid-template-columns:1fr 104px}.subtitle{font-size:11px}
  .answers{grid-template-columns:repeat(2,1fr)}
  footer{grid-template-columns:1fr}.controls{display:grid;grid-template-columns:1fr 1fr}
  .btn{width:100%;padding:10px}
}
@media(max-height:610px){
  h1{font-size:20px}.subtitle{display:none}.skill{padding:6px 8px}
  footer{grid-template-columns:1fr auto}.controls{display:flex}
  .answer{min-height:46px}.stimulus{font-size:clamp(38px,10vw,82px)}
}
</style>
</head>
<body>
<main id="app">
<header>
  <div>
    <h1>Test de <span style="color:var(--accent)">Stroop</span></h1>
    <div class="subtitle">Réponds selon la règle affichée, pas selon ton premier réflexe.</div>
  </div>
  <div class="control-stack">
    <label class="select-box">
      <small>Niveau</small>
      <select id="levelSelect"></select>
    </label>
    <label class="select-box">
      <small>Manche</small>
      <select id="roundSelect">
        <option value="0">1 / 4</option><option value="1">2 / 4</option>
        <option value="2">3 / 4</option><option value="3">4 / 4</option>
      </select>
    </label>
  </div>
</header>

<section class="skill">
  <div>
    <small>Compétences travaillées</small>
    <strong id="skillText"></strong>
  </div>
  <div id="progress" class="progress"></div>
</section>

<section class="arena">
  <div id="ruleText" class="rule"><strong>Règle :</strong> choisis la couleur de l’encre.</div>
  <div class="stimulus-wrap">
    <div id="stimulus" class="stimulus">PRÊT</div>
  </div>
  <div id="answers" class="answers"></div>
  <div id="countdown" class="countdown">—</div>
</section>

<footer>
  <div id="status" class="status"><strong>Prêt.</strong> Appuie sur Commencer.</div>
  <div class="controls">
    <button id="restartBtn" class="btn secondary" type="button">Recommencer</button>
    <button id="startBtn" class="btn" type="button">Commencer</button>
  </div>
</footer>

<section id="resultOverlay" class="overlay" hidden>
  <div class="panel">
    <h2 id="resultTitle">Manche terminée</h2>
    <p id="resultText"></p>
    <div class="result-grid">
      <div class="result-card"><small>Précision</small><strong id="accuracyValue">0%</strong></div>
      <div class="result-card"><small>Temps moyen</small><strong id="timeValue">0 ms</strong></div>
      <div class="result-card"><small>Score</small><strong id="scoreValue">0</strong></div>
    </div>
    <button id="continueBtn" class="btn" type="button">Continuer</button>
  </div>
</section>
</main>

<script>
"use strict";

const COLORS=[
  {name:"ROUGE",hex:"#ff5d73"},
  {name:"VERT",hex:"#38dc79"},
  {name:"BLEU",hex:"#55a8ff"},
  {name:"JAUNE",hex:"#f3d93b"},
  {name:"VIOLET",hex:"#9b7cff"},
  {name:"ORANGE",hex:"#ff9f43"}
];

const LEVELS={
1:{colors:3,trials:8,limit:2600,incongruent:.45,shuffle:false,distractor:false,switchRule:false,neutral:false,skill:"Attention sélective, inhibition simple"},
2:{colors:4,trials:10,limit:2450,incongruent:.55,shuffle:false,distractor:true,switchRule:false,neutral:false,skill:"Contrôle de l’interférence, attention visuelle"},
3:{colors:4,trials:10,limit:2300,incongruent:.65,shuffle:true,distractor:true,switchRule:false,neutral:false,skill:"Inhibition et vitesse de décision"},
4:{colors:4,trials:12,limit:2150,incongruent:.72,shuffle:true,distractor:true,switchRule:true,neutral:false,skill:"Flexibilité cognitive et changement de règle"},
5:{colors:4,trials:12,limit:2000,incongruent:.78,shuffle:true,distractor:true,switchRule:true,neutral:true,skill:"Attention soutenue, adaptation à des stimuli neutres"},
6:{colors:5,trials:12,limit:1900,incongruent:.8,shuffle:true,distractor:true,switchRule:true,neutral:true,skill:"Traitement rapide et inhibition renforcée"},
7:{colors:5,trials:14,limit:1800,incongruent:.82,shuffle:true,distractor:true,switchRule:true,neutral:true,skill:"Mémoire de règle et contrôle attentionnel"},
8:{colors:5,trials:14,limit:1700,incongruent:.84,shuffle:true,distractor:true,switchRule:true,neutral:true,skill:"Flexibilité sous pression temporelle"},
9:{colors:5,trials:15,limit:1600,incongruent:.86,shuffle:true,distractor:true,switchRule:true,neutral:true,skill:"Décision rapide avec forte interférence"},
10:{colors:6,trials:15,limit:1500,incongruent:.88,shuffle:true,distractor:true,switchRule:true,neutral:true,skill:"Sélection de l’information sous charge élevée"},
11:{colors:6,trials:16,limit:1420,incongruent:.9,shuffle:true,distractor:true,switchRule:true,neutral:true,skill:"Inhibition avancée et concentration durable"},
12:{colors:6,trials:16,limit:1340,incongruent:.91,shuffle:true,distractor:true,switchRule:true,neutral:true,skill:"Adaptation cognitive à rythme rapide"},
13:{colors:6,trials:18,limit:1260,incongruent:.92,shuffle:true,distractor:true,switchRule:true,neutral:true,skill:"Décision sous forte pression"},
14:{colors:6,trials:18,limit:1180,incongruent:.94,shuffle:true,distractor:true,switchRule:true,neutral:true,skill:"Contrôle exécutif à haute vitesse"},
15:{colors:6,trials:20,limit:1050,incongruent:.95,shuffle:true,distractor:true,switchRule:true,neutral:true,skill:"Maîtrise de l’inhibition et flexibilité maximale"}
};

const ROUND_VARIANTS=[
  {name:"Couleur de l’encre",baseRule:"ink",randomRule:false,doubleDistractor:false},
  {name:"Mot écrit",baseRule:"word",randomRule:false,doubleDistractor:false},
  {name:"Règle alternée",baseRule:"ink",randomRule:true,doubleDistractor:false},
  {name:"Interférence renforcée",baseRule:"ink",randomRule:true,doubleDistractor:true}
];

const levelSelect=document.getElementById("levelSelect");
const roundSelect=document.getElementById("roundSelect");
const skillText=document.getElementById("skillText");
const progress=document.getElementById("progress");
const ruleText=document.getElementById("ruleText");
const stimulus=document.getElementById("stimulus");
const answers=document.getElementById("answers");
const countdown=document.getElementById("countdown");
const status=document.getElementById("status");
const startBtn=document.getElementById("startBtn");
const restartBtn=document.getElementById("restartBtn");
const overlay=document.getElementById("resultOverlay");
const resultTitle=document.getElementById("resultTitle");
const resultText=document.getElementById("resultText");
const accuracyValue=document.getElementById("accuracyValue");
const timeValue=document.getElementById("timeValue");
const scoreValue=document.getElementById("scoreValue");
const continueBtn=document.getElementById("continueBtn");

levelSelect.innerHTML=Array.from({length:15},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join("");

let level=1,roundIndex=0,trial=0,correct=0,totalTime=0,trialStarted=0,currentAnswer="",running=false,timer=null,passedRounds=new Set();

function cfg(){return LEVELS[level]}
function variant(){return ROUND_VARIANTS[roundIndex]}
function setStatus(title,text=""){status.innerHTML=`<strong>${title}</strong>${text?" "+text:""}`}
function updateProgress(){
  progress.innerHTML="";
  for(let i=0;i<4;i++){
    const s=document.createElement("span");
    s.className="step"+(passedRounds.has(i)?" done":i===roundIndex?" active":"");
    progress.appendChild(s)
  }
}
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function updateUI(){
  skillText.textContent=cfg().skill+" — "+variant().name;
  roundSelect.value=String(roundIndex);
  updateProgress();
  resetRound()
}
function resetRound(){
  clearTimeout(timer);running=false;trial=0;correct=0;totalTime=0;currentAnswer="";
  startBtn.disabled=false;stimulus.textContent="PRÊT";stimulus.style.color="var(--text)";
  countdown.textContent="—";answers.innerHTML="";setStatus("Prêt.","Appuie sur Commencer.");
  setRuleLabel(variant().baseRule)
}
function setRuleLabel(rule){
  ruleText.innerHTML=`<strong>Règle :</strong> ${rule==="ink"?"choisis la couleur de l’encre.":"choisis le mot écrit."}`
}
function chooseRule(){
  const v=variant(),c=cfg();
  if(v.randomRule && c.switchRule)return Math.random()<.5?"ink":"word";
  return v.baseRule
}
function makeTrial(){
  const c=cfg(),v=variant(),available=COLORS.slice(0,c.colors);
  let wordColor=available[Math.floor(Math.random()*available.length)];
  let inkColor;
  const useNeutral=c.neutral&&Math.random()<.12;
  if(useNeutral){
    stimulus.textContent="BALLON";
    inkColor=available[Math.floor(Math.random()*available.length)]
  }else{
    stimulus.textContent=wordColor.name;
    if(Math.random()<c.incongruent){
      do{inkColor=available[Math.floor(Math.random()*available.length)]}while(inkColor.name===wordColor.name)
    }else inkColor=wordColor
  }
  stimulus.style.color=inkColor.hex;

  const rule=chooseRule();
  setRuleLabel(rule);
  currentAnswer=rule==="ink"?inkColor.name:(useNeutral?inkColor.name:wordColor.name);

  let options=available;
  if(c.shuffle)options=shuffle(options);
  answers.innerHTML="";
  options.forEach(col=>{
    const b=document.createElement("button");
    b.type="button";b.className="answer";b.textContent=col.name;b.style.background=col.hex;
    b.addEventListener("click",()=>submit(col.name));
    answers.appendChild(b)
  });

  if(c.distractor){
    stimulus.style.textShadow=v.doubleDistractor
      ?"8px 7px 0 rgba(255,255,255,.12), -8px -7px 0 rgba(255,255,255,.08)"
      :"5px 5px 0 rgba(255,255,255,.1)";
    stimulus.style.transform=`translate(${(Math.random()-.5)*18}px,${(Math.random()-.5)*12}px) rotate(${(Math.random()-.5)*6}deg)`
  }else{
    stimulus.style.textShadow="none";stimulus.style.transform="none"
  }

  trialStarted=performance.now();
  let remaining=c.limit;
  countdown.textContent=(remaining/1000).toFixed(1)+" s";
  clearTimeout(timer);
  const tick=()=>{
    if(!running)return;
    remaining=c.limit-(performance.now()-trialStarted);
    countdown.textContent=Math.max(0,remaining/1000).toFixed(1)+" s";
    if(remaining<=0){submit(null);return}
    timer=setTimeout(tick,60)
  };
  tick()
}
function submit(value){
  if(!running)return;
  clearTimeout(timer);
  const elapsed=performance.now()-trialStarted;
  totalTime+=Math.min(elapsed,cfg().limit);
  if(value===currentAnswer)correct++;
  trial++;
  setStatus(value===currentAnswer?"Correct.":"Incorrect.",`${correct}/${trial} bonnes réponses.`);
  if(trial>=cfg().trials){finishRound();return}
  stimulus.textContent="•";answers.innerHTML="";countdown.textContent="—";
  timer=setTimeout(makeTrial,280)
}
function startRound(){
  if(running)return;
  running=true;trial=0;correct=0;totalTime=0;startBtn.disabled=true;
  setStatus("Manche en cours.",variant().name);
  makeTrial()
}
function finishRound(){
  running=false;clearTimeout(timer);
  const accuracy=Math.round(correct/cfg().trials*100);
  const avg=Math.round(totalTime/cfg().trials);
  const score=Math.max(0,Math.round(accuracy*10+(cfg().limit-avg)/3));
  const passed=accuracy>=80&&avg<=cfg().limit*.9;
  if(passed)passedRounds.add(roundIndex);

  accuracyValue.textContent=accuracy+"%";
  timeValue.textContent=avg+" ms";
  scoreValue.textContent=score;
  resultTitle.textContent=passed?"Manche validée":"Manche à retravailler";
  resultText.textContent=passed
    ?"La précision et la vitesse sont suffisantes pour cette manche."
    :"Il faut améliorer la précision ou répondre plus rapidement.";
  continueBtn.textContent=passed?(roundIndex===3?"Terminer le niveau":"Manche suivante"):"Réessayer";
  continueBtn.onclick=()=>{
    overlay.hidden=true;
    if(passed&&roundIndex<3){roundIndex++;updateUI()}
    else if(passed&&roundIndex===3){setStatus("Niveau validé !","Les 4 manches sont réussies.");startBtn.disabled=false}
    else resetRound()
  };
  overlay.hidden=false
}
levelSelect.addEventListener("change",()=>{level=Number(levelSelect.value);passedRounds.clear();roundIndex=0;updateUI()});
roundSelect.addEventListener("change",()=>{roundIndex=Number(roundSelect.value);updateUI()});
startBtn.addEventListener("click",startRound);
restartBtn.addEventListener("click",resetRound);

updateUI();
</script>
</body>
</html>
